<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#174f3c">
    <title>Connexion indisponible</title>
    <style>
        body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f7f3e8; color: #173d31; font-family: system-ui, sans-serif; }
        main { width: min(30rem, calc(100% - 3rem)); padding: 2rem; border-radius: 1.5rem; background: #fff; box-shadow: 0 12px 40px rgba(23, 79, 60, .12); text-align: center; }
        h1 { margin-top: 0; }
        button { padding: .8rem 1.2rem; border: 0; border-radius: 999px; background: #174f3c; color: #fff; cursor: pointer; font-weight: 700; }
    </style>
</head>
<body>
<main>
    <h1>Connexion indisponible</h1>
    <p>Les données personnelles ne sont pas conservées hors ligne. Reconnecte-toi pour retrouver ton suivi.</p>
    <button type="button" onclick="window.location.reload()">Réessayer</button>
</main>
</body>
</html>
