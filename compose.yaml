services:

  php-fpm:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: weight-project-php
    environment:
      TZ: ${TZ}
      APP_ENV: ${APP_RUNTIME_ENV:-prod}
      APP_DEBUG: ${APP_RUNTIME_DEBUG:-0}
      DATABASE_URL: "mysql://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?serverVersion=${DATABASE_SERVER_VERSION}&charset=${DATABASE_CHARSET}"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,REMOTE_ADDR}
    volumes:
      - ./:/var/www/html
    depends_on:
      - database

  nginx:
    image: nginx:alpine
    container_name: weight-project-nginx
    environment:
      TZ: ${TZ}
    ports:
      - "${NGINX_EXTERNAL_PORT}:${NGINX_INTERNAL_PORT}"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm

  database:
    image: mariadb:10.11
    container_name: weight-project-db
    environment:
      TZ: ${TZ}
      MARIADB_DATABASE: ${DATABASE_NAME}
      MARIADB_USER: ${DATABASE_USER}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
    command: --default-time-zone=Europe/Paris
    ports:
      - "${DATABASE_EXTERNAL_PORT}:${DATABASE_PORT}"
    volumes:
      - database_data:/var/lib/mysql

volumes:
  database_data:
